<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Please Forgive Me ❤️</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

body {
  height: 100vh;
  overflow: hidden;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fad0c4);
  display: flex;
  align-items: center;
  justify-content: center;
}

.container {
  background: white;
  padding: 40px;
  border-radius: 25px;
  text-align: center;
  box-shadow: 0 15px 40px rgba(0,0,0,0.15);
  max-width: 450px;
  width: 90%;
  position: relative;
  z-index: 2;
  animation: fadeIn 1s ease;
}

h1 {
  color: #ff4d6d;
  margin-bottom: 10px;
}

p {
  color: #555;
  margin-bottom: 20px;
}

.photo-preview {
  width: 150px;
  height: 150px;
  border-radius: 50%;
  object-fit: cover;
  border: 5px solid #ff4d6d;
  margin-bottom: 15px;
}

input[type="file"] {
  margin-bottom: 15px;
}

.buttons {
  position: relative;
  height: 100px;
}

button {
  padding: 12px 20px;
  border: none;
  border-radius: 15px;
  cursor: pointer;
  font-size: 16px;
  position: absolute;
}

#yesBtn {
  background: #28a745;
  color: white;
  left: 25%;
}

#noBtn {
  background: #dc3545;
  color: white;
  right: 25%;
}

button:hover {
  transform: scale(1.05);
}

.floating-heart {
  position: absolute;
  color: rgba(255,0,100,0.5);
  font-size: 20px;
  animation: floatUp linear infinite;
}

@keyframes floatUp {
  from {
    transform: translateY(100vh);
    opacity: 1;
  }
  to {
    transform: translateY(-10vh);
    opacity: 0;
  }
}

@keyframes fadeIn {
  from { opacity:0; transform: translateY(20px);} 
  to { opacity:1; transform: translateY(0);} 
}
</style>
</head>

<body>

<div class="container">

<img id="photo" class="photo-preview" src="https://i.imgur.com/0y0y0y0.png" alt="Your Love">
<br>
<input type="file" accept="image/*" onchange="loadPhoto(event)">

<h1>I'm Really Sorry ❤️</h1>
<p>You are my everything. I never want to lose you. Please forgive me?</p>

<div class="buttons">
  <button id="yesBtn">Yes, I Forgive You ❤️</button>
  <button id="noBtn">No 😢</button>
</div>

</div>

<audio id="loveSong" loop>
<source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mp3">
</audio>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const song = document.getElementById("loveSong");

// move NO button
noBtn.addEventListener("mouseover", () => {
  const x = Math.random() * (window.innerWidth - 100);
  const y = Math.random() * (window.innerHeight - 100);
  noBtn.style.position = "fixed";
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
});

// YES button click
yesBtn.addEventListener("click", () => {
  song.play();
  alert("I knew you would forgive me ❤️");
});

// photo upload
function loadPhoto(event) {
  const image = document.getElementById('photo');
  image.src = URL.createObjectURL(event.target.files[0]);
}

// floating hearts
function createHeart() {
  const heart = document.createElement("div");
  heart.classList.add("floating-heart");
  heart.innerHTML = "❤";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.animationDuration = (Math.random() * 3 + 2) + "s";
  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 5000);
}

setInterval(createHeart, 300);
</script>

</body>
</html>
